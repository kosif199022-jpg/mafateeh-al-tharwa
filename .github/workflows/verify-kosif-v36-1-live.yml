name: Verify Kosif v36.2.1 Live Browser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-kosif-v36-1-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KOSIF_TEST_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - name: Checkout Kosif production source
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/mahmoud1990
          ref: main
      - name: Install Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Run production mobile browser probe
        run: node scripts/verify-v36-2-1-runtime.cjs
      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v36-2-1-live-browser
          path: kosif-v36-2-1-mobile.png
          if-no-files-found: ignore
