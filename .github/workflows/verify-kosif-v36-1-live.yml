name: Verify Kosif v36.1 Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-kosif-v36-1-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - name: Verify propagated v36.1 Worker and assets
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 20); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            hcode=$(curl -sS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/__health?cb=$cb" -o /tmp/health.json -w '%{http_code}' || true)
            rcode=$(curl -sS -D /tmp/root.headers -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/?cb=$cb" -o /tmp/root.html -w '%{http_code}' || true)
            tr -d '\r' < /tmp/root.headers > /tmp/root.clean || true
            release=$(awk 'BEGIN{IGNORECASE=1} /^x-kosif-release:/{sub(/^x-kosif-release:[[:space:]]*/,"");print;exit}' /tmp/root.clean || true)
            echo "attempt=$attempt health=$hcode root=$rcode release=$release healthBody=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$hcode" = 200 ] && [ "$rcode" = 200 ] \
              && grep -q '"version":"v36.1"' /tmp/health.json \
              && grep -q '"aiGate":"owner-password+verified-key"' /tmp/health.json \
              && [ "$release" = 'native-v36-1-deep-audit' ] \
              && grep -q 'KOSIF_CLIENT_V36_1_2026_08_17' /tmp/root.html \
              && ! grep -q 'AI Active ·' /tmp/root.html; then
              passed=1; break
            fi
            sleep 5
          done
          [ "$passed" -eq 1 ] || { echo '::error::v36.1 did not fully propagate to root + health'; exit 1; }

          cb="${GITHUB_RUN_ID}-std-$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/standards/?cb=$cb" -o /tmp/standards.html
          grep -q 'reader-pro-v36.js?v=36.1' /tmp/standards.html
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/standards/data/library.json?cb=$cb" -o /tmp/library.json
          node - <<'NODE'
          const x=require('/tmp/library.json');
          const b1=x.find(v=>v.id==='b1'), b3=x.find(v=>v.id==='b3'), b2=x.find(v=>v.id==='b2');
          if(!b1||b1.chapters!==66) throw Error('b1 metadata mismatch');
          if(!b3||b3.chapters!==34) throw Error('b3 metadata mismatch');
          if(!b2||b2.chapters!==139) throw Error('b2 metadata mismatch');
          console.log('library',b1.chapters,b3.chapters,b2.chapters);
          NODE

          status=$(curl -sS -o /tmp/status.json -w '%{http_code}' "$LIVE_URL/api/kosif/auth/status")
          echo "auth_status_http=$status body=$(cat /tmp/status.json)"
          [ "$status" = 200 ]
          grep -q '"unlocked":false' /tmp/status.json

          locked=$(curl -sS -o /tmp/locked.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"provider":"gemini","model":"gemini-3.6-flash","key":"dummy","prompt":"x"}' "$LIVE_URL/api/kosif/ai")
          echo "ai_http=$locked body=$(cat /tmp/locked.json)"
          [ "$locked" = 401 ]
          grep -q 'AI_LOCKED' /tmp/locked.json

          testlocked=$(curl -sS -o /tmp/testlocked.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"provider":"gemini","model":"gemini-3.6-flash","key":"dummy"}' "$LIVE_URL/api/kosif/ai/test")
          echo "ai_test_http=$testlocked body=$(cat /tmp/testlocked.json)"
          [ "$testlocked" = 401 ]
          grep -q 'AI_LOCKED' /tmp/testlocked.json

          echo 'LIVE_KOSIF_V36_1_PROPAGATED_AND_LOCKED_OK'
