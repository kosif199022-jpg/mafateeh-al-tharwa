name: Deploy Mafateeh Stable Reader v38 to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mafateeh-al-tharwa.kosif199022.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured.'; exit 2; }

      - name: Install dependencies
        run: npm ci

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Validate transformation scripts
        run: |
          node --check scripts/apply-v37-stable-reader-architecture.mjs
          node --check scripts/apply-v38-audio-scroll-containment.mjs
          node --check scripts/apply-v36-audiobook-builder.mjs

      - name: Apply modified 46-chapter book
        run: node scripts/apply-modified-book.mjs

      - name: Restore stable Reader v12 native-scroll base
        run: node scripts/apply-v37-stable-reader-architecture.mjs

      - name: Apply isolated mobile audiobook scrolling v38
        run: node scripts/apply-v38-audio-scroll-containment.mjs

      - name: Add in-app Gemini mixed audiobook and durable R2 source
        run: node scripts/apply-v36-audiobook-builder.mjs

      - name: Verify stable v38 mobile reader contract
        run: node tests/stable-reader-v37-regression.test.mjs

      - name: Validate loaded reader JavaScript
        run: |
          node --check public/reader-tools.js
          node --check public/reader-ambience.js
          node --check public/reader-audiobook-builder.js
          node --check public/piper-worker.js

      - name: Build Cloudflare Worker artifact
        run: npm run build

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --name mafateeh-al-tharwa

      - name: Smoke test live stable deployment
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./public/master-version.json').version")"
          expected_major="${expected_version%%.*}"
          expected_build="$(node -p "require('./public/master-version.json').buildId")"
          test -n "$expected_build" || { echo '::error::Build ID is missing.'; exit 2; }
          base_cb="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          check_live_assets() {
            local attempt="$1"
            local cb="${base_cb}-${attempt}-$(date +%s)"
            local q="v=${expected_major}&b=${expected_build}&cb=${cb}"
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/master-version.json?cb=$cb" -o /tmp/mafateeh-version.json || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader.html?$q" -o /tmp/mafateeh-reader.html || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/sw.js?$q" -o /tmp/mafateeh-sw.js || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/manifest.webmanifest?$q" -o /tmp/mafateeh-manifest.webmanifest || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader-audiobook-builder.js?$q" -o /tmp/mafateeh-builder.js || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/api/audiobook/status?cb=$cb" -o /tmp/mafateeh-audio-status.json || return 1

            EXPECTED_VERSION="$expected_version" EXPECTED_MAJOR="$expected_major" EXPECTED_BUILD="$expected_build" node <<'NODE'
          const fs=require('fs');
          const expected=process.env.EXPECTED_VERSION;
          const major=process.env.EXPECTED_MAJOR;
          const build=process.env.EXPECTED_BUILD;
          const q=`v=${major}&b=${build}`;
          const version=JSON.parse(fs.readFileSync('/tmp/mafateeh-version.json','utf8'));
          const reader=fs.readFileSync('/tmp/mafateeh-reader.html','utf8');
          const sw=fs.readFileSync('/tmp/mafateeh-sw.js','utf8');
          const manifest=fs.readFileSync('/tmp/mafateeh-manifest.webmanifest','utf8');
          const builder=fs.readFileSync('/tmp/mafateeh-builder.js','utf8');
          const audioStatus=JSON.parse(fs.readFileSync('/tmp/mafateeh-audio-status.json','utf8'));
          const checks=[
            ['live v38 build',version.version===expected&&expected==='38.0.0'&&String(version.buildId)===build],
            ['stable Reader v12 marker',reader.includes('Mafateeh stable Reader v12 architecture + isolated audio scroll v38')],
            ['audio shade opens as flex',reader.includes('#audioShade.on{display:flex}')],
            ['audio sheet native scroll + viewport fallback',/#audioSheet\{[^}]*max-height:92vh;max-height:92dvh;[^}]*overflow-y:auto;[^}]*-webkit-overflow-scrolling:touch;[^}]*touch-action:pan-y/s.test(reader)],
            ['install sheet native scroll + viewport fallback',/#installSheet\{[^}]*max-height:90vh;max-height:90dvh;[^}]*overflow-y:auto;[^}]*-webkit-overflow-scrolling:touch/s.test(reader)],
            ['scoped root/body page lock',reader.includes("root.style.overflow='hidden'")&&reader.includes("b.style.position='fixed'")],
            ['boundary prime present',reader.includes('function mediaPrimeScrollBoundary()')],
            ['sheet touchmove remains native',!reader.includes("mediaNativeSheet?.addEventListener('touchmove'")],
            ['no shade touch-action none',!/#audioShade\{[^}]*touch-action:none/s.test(reader)],
            ['no master touch runtime',!reader.includes('reader-master-fixes.js')],
            ['no global audio guard',!reader.includes('reader-audio-touch-guard.js')],
            ['stable tools build-scoped',reader.includes(`/reader-tools.js?${q}`)],
            ['stable ambience build-scoped',reader.includes(`/reader-ambience.js?${q}`)],
            ['service worker build-scoped',reader.includes(`/sw.js?${q}`)],
            ['manifest build-scoped',reader.includes(`/manifest.webmanifest?${q}`)],
            ['later modules removed',!reader.includes('reader-formats.js')&&!reader.includes('reader-studio.js')&&!reader.includes('reader-mixer.js')&&!reader.includes('reader-smart-suite.js')],
            ['chapter 46 live',/"no"\s*:\s*46/.test(reader)],
            ['word seek retained',reader.includes('mediaStartFromWord')&&reader.includes('data-audio-word')],
            ['all listen modes retained',reader.includes('data-mode="chapter"')&&reader.includes('data-mode="book"')&&reader.includes('data-mode="selection"')],
            ['Gemini builder build-scoped',reader.includes(`/reader-audiobook-builder.js?${q}`)],
            ['durable R2 URLs wired',reader.includes('/api/audiobook/audio/')&&reader.includes('/api/audiobook/timing/')],
            ['Charon and Kore builder',builder.includes('Charon')&&builder.includes('Kore')],
            ['build-scoped PWA cache',sw.includes(`mafateeh-v38-${build}`)&&sw.includes(`mafateeh-runtime-v38-${build}`)],
            ['build-scoped offline fallback',sw.includes(`OFFLINE_FALLBACK = "/reader.html?${q}"`)],
            ['v38 PWA start',manifest.includes('"start_url": "/reader.html?v=38"')],
            ['R2 storage bound',audioStatus.storage===true],
            ['reference design retained',reader.includes('--gold:#B4894A;')&&reader.includes('--navy:#1F3352;')],
          ];
          let failed=false;
          for(const [label,ok] of checks){console.log(`${ok?'PASS':'WAIT'}: ${label}`);if(!ok)failed=true;}
          if(failed)process.exit(1);
          NODE
          }

          ok=0
          for attempt in $(seq 1 20); do
            echo "Live v38 propagation check $attempt/20..."
            if check_live_assets "$attempt"; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Cloudflare did not converge to the stable v38 build in time.'; exit 1; }
          echo "Live smoke test passed — stable mobile native scrolling + fresh PWA assets + 46 chapters + Gemini/R2."
