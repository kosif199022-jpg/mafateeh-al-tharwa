name: Deploy Mafateeh Master to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mafateeh-al-tharwa.kosif199022.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured.'; exit 2; }

      - name: Install dependencies
        run: npm ci

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Apply Master v32 reader fixes
        run: node scripts/apply-v32-reader-fixes.mjs

      - name: Apply Master v33 iOS fixes
        run: node scripts/apply-v33-ios-fixes.mjs

      - name: Apply modified 46-chapter book
        run: node scripts/apply-modified-book.mjs

      - name: Apply Master v34 permanent scroll fixes
        run: node scripts/apply-v34-scroll-fixes.mjs

      - name: Verify v34 base scroll fixes
        run: node tests/scroll-v34-regression.test.mjs

      - name: Apply Master v35 unified modal fixes
        run: node scripts/apply-v35-scroll-fixes.mjs

      - name: Master regression guard
        run: scripts/master-regression.sh

      - name: Verify v35 all-modal scroll fixes
        run: node tests/scroll-v35-regression.test.mjs

      - name: Validate reader JavaScript
        run: |
          node --check public/reader-tools.js
          node --check public/reader-ambience.js
          node --check public/reader-studio.js
          node --check public/reader-formats.js
          node --check public/reader-mixer.js
          node --check public/reader-smart-suite.js
          node --check public/reader-master-fixes.js
          node --check public/piper-worker.js

      - name: Build Cloudflare Worker artifact
        run: npm run build

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --name mafateeh-al-tharwa

      - name: Smoke test live deployment
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./public/master-version.json').version")"
          expected_major="${expected_version%%.*}"
          base_cb="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          check_live_assets() {
            local attempt="$1"
            local cb="${base_cb}-${attempt}-$(date +%s)"
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/master-version.json?cb=$cb" -o /tmp/mafateeh-version.json || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader.html?v=$expected_major&cb=$cb" -o /tmp/mafateeh-reader.html || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/sw.js?v=$expected_major&cb=$cb" -o /tmp/mafateeh-sw.js || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/manifest.webmanifest?v=$expected_major&cb=$cb" -o /tmp/mafateeh-manifest.webmanifest || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader-smart-suite.css?v=$expected_major&cb=$cb" -o /tmp/mafateeh-smart.css || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader-mixer.css?v=$expected_major&cb=$cb" -o /tmp/mafateeh-mixer.css || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader-tools.css?v=$expected_major&cb=$cb" -o /tmp/mafateeh-tools.css || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader-master-fixes.js?v=$expected_major&cb=$cb" -o /tmp/mafateeh-master.js || return 1

            EXPECTED_VERSION="$expected_version" EXPECTED_MAJOR="$expected_major" node <<'NODE'
          const fs = require('fs');
          const expected = process.env.EXPECTED_VERSION;
          const major = process.env.EXPECTED_MAJOR;
          const version = JSON.parse(fs.readFileSync('/tmp/mafateeh-version.json','utf8'));
          const reader = fs.readFileSync('/tmp/mafateeh-reader.html','utf8');
          const master = fs.readFileSync('/tmp/mafateeh-master.js','utf8');
          const sw = fs.readFileSync('/tmp/mafateeh-sw.js','utf8');
          const manifest = fs.readFileSync('/tmp/mafateeh-manifest.webmanifest','utf8');
          const smart = fs.readFileSync('/tmp/mafateeh-smart.css','utf8');
          const mixer = fs.readFileSync('/tmp/mafateeh-mixer.css','utf8');
          const tools = fs.readFileSync('/tmp/mafateeh-tools.css','utf8');
          const checks = [
            ['live version', version.version === expected],
            ['reader master fixes loaded', reader.includes(`reader-master-fixes.js?v=${major}`)],
            ['instant auto-scroll enabled', reader.includes("behavior:'instant'")],
            ['real scrolling element used', reader.includes('document.scrollingElement||document.documentElement')],
            ['visual viewport used', reader.includes('window.visualViewport?.height||window.innerHeight')],
            ['modified chapter 46 live', /"no"\s*:\s*46/.test(reader)],
            ['master fixes cached offline', sw.includes(`/reader-master-fixes.js?v=${major}`)],
            ['PWA start URL versioned', manifest.includes(`"start_url": "/reader.html?v=${major}"`)],
            ['smart floating dock hidden', smart.includes('#smartHubDock{display:none!important}')],
            ['mixer floating dock hidden', mixer.includes('.mixer-dock{display:none!important}')],
            ['iOS direct scroll fallback present', master.includes('Mafateeh iOS direct-scroll fallback v34')],
            ['runtime is v35', master.includes("const VERSION='35.0.0';")],
            ['tool sheet primary scroller', master.includes("'.tool-shade.on .tool-sheet'")),
            ['form control swipe escape', master.includes('textarea,input,select,[contenteditable="true"]')],
            ['tool sheet CSS fix live', tools.includes('Master v35 — unified iPhone tool-sheet scrolling')],
            ['tool sheet vertical scrolling live', tools.includes('overflow-y:auto!important')],
            ['root overflow lock removed', !master.includes("h.style.overflow='hidden'")],
            ['body touch lock removed', !master.includes("b.style.touchAction='none'")],
          ];
          let failed = false;
          for (const [label, ok] of checks) {
            console.log(`${ok ? 'PASS' : 'WAIT'}: ${label}`);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE
          }

          ok=0
          for attempt in $(seq 1 12); do
            echo "Live asset propagation check $attempt/12..."
            if check_live_assets "$attempt"; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Cloudflare assets did not converge to the same v35 deployment in time.'; exit 1; }
          echo "Live smoke test passed for $LIVE_URL (v$expected_version, all modal/tool-sheet scrolling unified)."
