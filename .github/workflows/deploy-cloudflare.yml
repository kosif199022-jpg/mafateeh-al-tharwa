name: Deploy Mafateeh V13 to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured."
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prepare V13 source
        shell: bash
        run: |
          chmod +x scripts/*.sh
          sed -i '/reader-mixer\.css/d;/reader-smart-suite\.css/d;/reader-mixer\.js/d;/reader-smart-suite\.js/d' public/reader.html
          rm -f public/reader-mixer.js public/reader-mixer.css public/reader-mixer-core-v22.js public/reader-smart-suite.js public/reader-smart-suite.css public/piper-worker.js

      - name: Validate V13 reader scripts
        run: |
          node --check public/reader-tools.js
          node --check public/reader-ambience.js
          node --check public/reader-studio.js
          node --check public/reader-formats.js

      - name: Build Cloudflare Worker artifact
        run: npm run build

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --name mafateeh-al-tharwa
