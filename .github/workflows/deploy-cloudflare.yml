name: Deploy Mafateeh Stable Reader v37 to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mafateeh-al-tharwa.kosif199022.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured.'; exit 2; }

      - name: Install dependencies
        run: npm ci

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Apply modified 46-chapter book
        run: node scripts/apply-modified-book.mjs

      - name: Restore user stable native-scroll reader architecture
        run: node scripts/apply-v37-stable-reader-architecture.mjs

      - name: Add in-app Gemini mixed audiobook and durable R2 source
        run: node scripts/apply-v36-audiobook-builder.mjs

      - name: Verify stable v37 reader contract
        run: node tests/stable-reader-v37-regression.test.mjs

      - name: Validate reader JavaScript
        run: |
          node --check public/reader-tools.js
          node --check public/reader-ambience.js
          node --check public/reader-studio.js
          node --check public/reader-formats.js
          node --check public/reader-mixer.js
          node --check public/reader-smart-suite.js
          node --check public/reader-audiobook-builder.js
          node --check public/piper-worker.js

      - name: Build Cloudflare Worker artifact
        run: npm run build

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --name mafateeh-al-tharwa

      - name: Smoke test live stable deployment
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./public/master-version.json').version")"
          expected_major="${expected_version%%.*}"
          base_cb="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          check_live_assets() {
            local attempt="$1"
            local cb="${base_cb}-${attempt}-$(date +%s)"
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/master-version.json?cb=$cb" -o /tmp/mafateeh-version.json || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader.html?v=$expected_major&cb=$cb" -o /tmp/mafateeh-reader.html || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/sw.js?v=$expected_major&cb=$cb" -o /tmp/mafateeh-sw.js || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/manifest.webmanifest?v=$expected_major&cb=$cb" -o /tmp/mafateeh-manifest.webmanifest || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/reader-audiobook-builder.js?v=$expected_major&cb=$cb" -o /tmp/mafateeh-builder.js || return 1
            curl -LfsS --max-redirs 5 --retry 2 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/api/audiobook/status?cb=$cb" -o /tmp/mafateeh-audio-status.json || return 1

            EXPECTED_VERSION="$expected_version" EXPECTED_MAJOR="$expected_major" node <<'NODE'
          const fs = require('fs');
          const expected = process.env.EXPECTED_VERSION;
          const major = process.env.EXPECTED_MAJOR;
          const version = JSON.parse(fs.readFileSync('/tmp/mafateeh-version.json','utf8'));
          const reader = fs.readFileSync('/tmp/mafateeh-reader.html','utf8');
          const sw = fs.readFileSync('/tmp/mafateeh-sw.js','utf8');
          const manifest = fs.readFileSync('/tmp/mafateeh-manifest.webmanifest','utf8');
          const builder = fs.readFileSync('/tmp/mafateeh-builder.js','utf8');
          const audioStatus = JSON.parse(fs.readFileSync('/tmp/mafateeh-audio-status.json','utf8'));
          const checks = [
            ['live version 37', version.version === expected && expected === '37.0.0'],
            ['stable architecture marker', reader.includes('Mafateeh stable native-scroll architecture v37')],
            ['stable audio shade display', reader.includes('#audioShade.on{display:flex}')],
            ['stable native audio sheet scroll', /#audioSheet\{[^}]*max-height:92dvh;overflow:auto/s.test(reader)],
            ['no master touch runtime', !reader.includes('reader-master-fixes.js')],
            ['no audio touch guard', !reader.includes('reader-audio-touch-guard.js')],
            ['no experimental audio scroll CSS', !reader.includes('mkAudioSheetScrollV36')],
            ['modified chapter 46 live', /"no"\s*:\s*46/.test(reader)],
            ['word click playback retained', reader.includes('mediaStartFromWord') && reader.includes('data-audio-word')],
            ['book/chapter/selection reader retained', reader.includes('data-mode="chapter"') && reader.includes('data-mode="book"') && reader.includes('data-mode="selection"')],
            ['Gemini builder loaded', reader.includes(`reader-audiobook-builder.js?v=${major}`)],
            ['durable audio endpoint wired', reader.includes('/api/audiobook/audio/') && reader.includes('/api/audiobook/timing/')],
            ['Gemini Charon/Kore builder present', builder.includes('Charon') && builder.includes('Kore')],
            ['stable PWA cache', sw.includes('mafateeh-al-tharwa-v37-stable-native')],
            ['removed master runtime not cached', !sw.includes('reader-master-fixes.js')],
            ['PWA start URL v37', manifest.includes('"start_url": "/reader.html?v=37"')],
            ['R2 audio storage bound', audioStatus.storage === true],
            ['reference design preserved', reader.includes('--gold:#B4894A;') && reader.includes('--navy:#1F3352;')],
          ];
          let failed=false;
          for(const [label,ok] of checks){console.log(`${ok?'PASS':'WAIT'}: ${label}`);if(!ok)failed=true;}
          if(failed)process.exit(1);
          NODE
          }

          ok=0
          for attempt in $(seq 1 15); do
            echo "Live stable propagation check $attempt/15..."
            if check_live_assets "$attempt"; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Cloudflare did not converge to the stable v37 reader in time.'; exit 1; }
          echo "Live smoke test passed for $LIVE_URL — stable v37 native scrolling + 46 chapters + Gemini/R2 audio."
