name: Deploy Mafateeh Master to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mafateeh-al-tharwa.kosif199022.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured.'; exit 2; }

      - name: Install dependencies
        run: npm ci

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Master regression guard
        run: scripts/master-regression.sh

      - name: Validate reader JavaScript
        run: |
          node --check public/reader-tools.js
          node --check public/reader-ambience.js
          node --check public/reader-studio.js
          node --check public/reader-formats.js
          node --check public/reader-mixer.js
          node --check public/reader-smart-suite.js
          node --check public/reader-master-fixes.js
          node --check public/piper-worker.js

      - name: Build Cloudflare Worker artifact
        run: npm run build

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --name mafateeh-al-tharwa

      - name: Smoke test live deployment
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./public/master-version.json').version")"
          expected_major="${expected_version%%.*}"
          cache_bust="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          live_version=""

          for attempt in 1 2 3 4 5 6 7 8; do
            live_version="$(curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$LIVE_URL/master-version.json?cb=$cache_bust" 2>/dev/null || true)"
            if LIVE_VERSION="$live_version" EXPECTED_VERSION="$expected_version" node -e 'try { const live=JSON.parse(process.env.LIVE_VERSION || "{}"); process.exit(live.version === process.env.EXPECTED_VERSION ? 0 : 1); } catch { process.exit(1); }'; then
              break
            fi
            sleep 3
          done

          LIVE_VERSION="$live_version" EXPECTED_VERSION="$expected_version" node -e 'const live=JSON.parse(process.env.LIVE_VERSION || "{}"); if (live.version !== process.env.EXPECTED_VERSION) { console.error(`Live version mismatch: expected ${process.env.EXPECTED_VERSION}, got ${live.version || "missing"}`); process.exit(1); } console.log(`Live version OK: ${live.version}`);'

          curl -fsS --retry 3 -H 'Cache-Control: no-cache' "$LIVE_URL/reader.html?cb=$cache_bust" -o /tmp/mafateeh-reader.html
          curl -fsS --retry 3 -H 'Cache-Control: no-cache' "$LIVE_URL/sw.js?cb=$cache_bust" -o /tmp/mafateeh-sw.js
          curl -fsS --retry 3 -H 'Cache-Control: no-cache' "$LIVE_URL/manifest.webmanifest?cb=$cache_bust" -o /tmp/mafateeh-manifest.webmanifest

          grep -Fq "reader-master-fixes.js?v=$expected_major" /tmp/mafateeh-reader.html
          grep -Fq "behavior:'instant'" /tmp/mafateeh-reader.html
          grep -Fq "/reader-master-fixes.js?v=$expected_major" /tmp/mafateeh-sw.js
          grep -Fq "\"start_url\": \"/reader.html?v=$expected_major\"" /tmp/mafateeh-manifest.webmanifest

          echo "Live smoke test passed for $LIVE_URL (v$expected_version)."
