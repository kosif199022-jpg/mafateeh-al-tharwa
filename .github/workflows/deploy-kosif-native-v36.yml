name: Deploy Kosif v36.2 Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-kosif-native-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kosif-v36-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - name: Checkout deployment credential repository
        uses: actions/checkout@v4

      - name: Checkout Kosif production main
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/mahmoud1990
          ref: main
          path: kosif

      - name: Verify Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Validate Kosif v36.2 production source
        working-directory: kosif
        shell: bash
        run: |
          set -euo pipefail
          for f in wrangler.toml src/worker.js src/kosif-workspace.js src/professional-upgrade.js public/index.html public/v36-features.js public/v36-operations.js public/v36-outputs.js public/v36-governance.js public/v36-standards-readiness.js public/v36-ai-gate.js public/v36.css public/sw.js public/standards/index.html public/standards/bridge.js public/standards/sw.js scripts/check-all.mjs scripts/validate-payloads.mjs scripts/deep-audit-v36.mjs; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          npm run check
          node scripts/deep-audit-v36.mjs
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/kosif-v36-2-worker.mjs >/dev/null
          grep -q "native-v36-2-attachments-upgrade" src/worker.js
          grep -q "version:'v36.2'" src/worker.js
          grep -q '/v36-operations.js?v=36.2' public/index.html
          grep -q 'KosifOperations' public/v36-operations.js
          grep -q 'gemini-3.6-flash' src/kosif-workspace.js
          grep -q 'gpt-5.6' src/kosif-workspace.js

      - name: Deploy Kosif v36.2 to live Worker
        working-directory: kosif
        run: npx --yes wrangler@4 deploy --name mahmoud-eldesouky

      - name: Verify live v36.2 deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            code=$(curl -LfsS --max-redirs 5 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/__health?cb=$cb" -o /tmp/health.json -w '%{http_code}' || true)
            echo "health attempt=$attempt http=$code body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = 200 ] && grep -q '"version":"v36.2"' /tmp/health.json && grep -q '"release":"Attachment Review & Operational Intelligence"' /tmp/health.json; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Live Worker did not report Kosif v36.2.'; exit 1; }

          ok=0
          for attempt in $(seq 1 20); do
            cb="${GITHUB_RUN_ID}-root-${attempt}-$(date +%s)"
            curl -LfsS -D /tmp/headers.txt -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/?cb=$cb" -o /tmp/index.html || true
            tr -d '\r' < /tmp/headers.txt > /tmp/headers.clean || true
            if grep -qi '^x-kosif-release: native-v36-2-attachments-upgrade$' /tmp/headers.clean && grep -q '/v36-operations.js?v=36.2' /tmp/index.html; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Live HTML/header not updated to v36.2.'; exit 1; }

          cb="${GITHUB_RUN_ID}-assets-$(date +%s)"
          for asset in /v36-operations.js /v36-features.js /v36-ai-gate.js /v36-standards-readiness.js /sw.js /standards/ /standards/reader-pro-v36.js /standards/data/library.json /library/smart; do
            code=$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL$asset?cb=$cb" -o /tmp/asset -w '%{http_code}' || true)
            echo "$asset => $code bytes=$(wc -c </tmp/asset 2>/dev/null || echo 0)"
            [ "$code" = 200 ] || { echo "::error::$asset returned $code"; exit 1; }
          done
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/v36-operations.js?cb=$cb" -o /tmp/ops.js
          grep -q 'KosifOperations' /tmp/ops.js
          grep -q 'هوامش سالبة' /tmp/ops.js

          ai_code=$(curl -sS -o /tmp/ai.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"provider":"gemini","model":"gemini-3.6-flash","key":"dummy","prompt":"x"}' "$LIVE_URL/api/kosif/ai")
          echo "AI locked status=$ai_code body=$(cat /tmp/ai.json)"
          [ "$ai_code" = 401 ] || { echo '::error::AI is not fail-closed.'; exit 1; }
          echo "LIVE_KOSIF_V36_2_OK $LIVE_URL"
