name: Deploy Kosif v36 Consolidated Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-kosif-native-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kosif-v36-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - name: Checkout deployment credential repository
        uses: actions/checkout@v4

      - name: Checkout Kosif v36 from production main
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/mahmoud1990
          ref: main
          path: kosif

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing in this repository.'; exit 2; }

      - name: Validate Kosif v36 production source
        shell: bash
        working-directory: kosif
        run: |
          set -euo pipefail
          for f in RELEASE_MANIFEST_V36.json wrangler.toml src/worker.js src/kosif-workspace.js public/index.html public/legacy/core-v36.js public/v36-features.js public/v36-outputs.js public/v36-governance.js public/v36-standards-readiness.js public/v36.css public/sw.js public/standards/index.html public/standards/bridge.js public/standards/sw.js; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          node --check public/legacy/core-v36.js
          node --check public/v36-features.js
          node --check public/v36-outputs.js
          node --check public/v36-governance.js
          node --check public/v36-standards-readiness.js
          node --check public/standards/bridge.js
          node --check public/sw.js
          node --check public/standards/sw.js
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/kosif-v36-worker.mjs >/dev/null
          node - <<'NODE'
          const m=require('./RELEASE_MANIFEST_V36.json');
          if(!String(m.release).includes('Kosif v36')) throw new Error('Not a v36 release');
          if(m.verification?.result!=='success') throw new Error('v36 manifest is not verified');
          if(m.verification?.demoAccounts<100) throw new Error('v36 demo verification is incomplete');
          console.log(m.release,'accounts=',m.verification.demoAccounts,'rounds=',m.verification.demoRounds);
          NODE
          grep -q "native-v36-consolidated" src/worker.js
          grep -q "version:'v36'" src/worker.js
          grep -q 'public/legacy/core-v36.js' README.md
          grep -q 'gemini-3.6-flash' src/kosif-workspace.js
          grep -q 'gpt-5.6' src/kosif-workspace.js

      - name: Deploy Kosif v36 to live Worker
        working-directory: kosif
        run: npx --yes wrangler@4 deploy --name mahmoud-eldesouky

      - name: Verify live v36 deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            code=$(curl -LfsS --max-redirs 5 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/__health?cb=$cb" -o /tmp/health.json -w '%{http_code}' || true)
            echo "attempt=$attempt http=$code body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = 200 ] && grep -q '"version":"v36"' /tmp/health.json && grep -q '"release":"Consolidated"' /tmp/health.json; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Live Worker did not report Kosif v36 Consolidated.'; exit 1; }

          cb="${GITHUB_RUN_ID}-final-$(date +%s)"
          curl -LfsS -D /tmp/headers.txt -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/?cb=$cb" -o /tmp/index.html
          tr -d '\r' < /tmp/headers.txt | tee /tmp/headers.clean
          grep -qi '^x-kosif-release: native-v36-consolidated$' /tmp/headers.clean
          grep -q '/legacy/core-v36.js?v=36' /tmp/index.html
          grep -q '/v36-features.js?v=36' /tmp/index.html
          grep -q '/v36-governance.js?v=36' /tmp/index.html
          grep -q '/v36-standards-readiness.js?v=36' /tmp/index.html
          grep -q 'kosif-bottom-nav' /tmp/index.html

          for asset in /legacy/core-v36.js /v36-features.js /v36-outputs.js /v36-governance.js /v36-standards-readiness.js /v36.css /sw.js /standards/bridge.js /standards/sw.js /standards/data/ref-map.json; do
            code=$(curl -LfsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL$asset?cb=$cb" -o /tmp/asset -w '%{http_code}' || true)
            echo "$asset => $code bytes=$(wc -c </tmp/asset 2>/dev/null || echo 0)"
            [ "$code" = 200 ] || exit 1
          done
          echo "LIVE_KOSIF_V36_OK $LIVE_URL"
