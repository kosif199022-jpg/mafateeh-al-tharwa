name: Secure and Deploy Kosif v36.3 AI Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-kosif-v36-3-ai-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-deploy-kosif-v36-3
  cancel-in-progress: false

jobs:
  secure-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Checkout latest Kosif main
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/mahmoud1990
          ref: main
          path: kosif
          fetch-depth: 1
      - name: Validate cleaned merged source
        working-directory: kosif
        run: |
          set -euo pipefail
          npm run check
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          grep -q "version:'v36.3'" src/worker.js
          grep -q 'KOSIF_AI_GATE_HASH' src/worker.js
          ! grep -q '^AI_GATE_HASH' wrangler.toml
          grep -q '90% إلى 200%' public/index.html
          grep -q 'kosif-native-v36-3-app' public/sw.js
      - name: Confirm source uses secret-only configuration
        working-directory: kosif
        run: |
          set -euo pipefail
          if grep -q '^AI_GATE_HASH' wrangler.toml; then
            echo '::error::Public AI gate verifier returned to wrangler.toml.'
            exit 2
          fi
          echo 'Public AI gate verifier absent; existing KOSIF_AI_GATE_HASH Cloudflare secret will be retained.'
      - name: Deploy latest cleaned main
        working-directory: kosif
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --name mahmoud-eldesouky 2>&1 | tee /tmp/kosif-secure-deploy.log
          echo '--- deployment identity ---'
          grep -Ei 'Version ID|Current Version ID|Uploaded mahmoud-eldesouky|Deployed mahmoud-eldesouky' /tmp/kosif-secure-deploy.log || true
      - name: Verify live secret gate, identity and libraries
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            h=$(curl -sS -H 'Cache-Control: no-store' "$LIVE_URL/__health?cb=$cb" -o /tmp/h.json -w '%{http_code}' || true)
            v=$(curl -sS -H 'Cache-Control: no-store' "$LIVE_URL/__version?cb=$cb" -o /tmp/v.json -w '%{http_code}' || true)
            if [ "$h" = 200 ] && [ "$v" = 200 ] && grep -q '"version":"v36.3"' /tmp/h.json && grep -q '"buildId":"2026.08.17-v36.3-master-requirements"' /tmp/v.json; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ]
          code=$(curl -sS -o /tmp/locked.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"provider":"gemini","model":"gemini-3.6-flash","key":"dummy","prompt":"x"}' "$LIVE_URL/api/kosif/ai")
          [ "$code" = 401 ]
          grep -q 'AI_LOCKED' /tmp/locked.json
          bad=$(curl -sS -o /tmp/bad-login.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"password":"__kosif_invalid_probe__"}' "$LIVE_URL/api/kosif/auth/login")
          [ "$bad" = 401 ] || [ "$bad" = 429 ]
          ! grep -q 'not configured' /tmp/bad-login.json
          std=$(curl -sS -o /tmp/std.html -w '%{http_code}' "$LIVE_URL/standards/?cb=$cb")
          smart=$(curl -sS -D /tmp/smart.h -o /tmp/smart.html -w '%{http_code}' "$LIVE_URL/library/smart?cb=$cb")
          [ "$std" = 200 ] && [ "$smart" = 200 ]
          tr -d '\r' < /tmp/smart.h | grep -qi '^x-kosif-library: smart-books'
          echo 'KOSIF_V36_3_CLEAN_SECRET_DEPLOY_OK'
