name: Verify Mafateeh Master

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Master regression guard
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/master-regression.sh || { echo '::error::master-regression.sh missing'; exit 2; }
          scripts/master-regression.sh

      - name: Validate reader JavaScript
        run: |
          node --check public/reader-tools.js
          node --check public/reader-ambience.js
          node --check public/reader-studio.js
          node --check public/reader-formats.js
          node --check public/reader-mixer.js
          node --check public/reader-smart-suite.js
          node --check public/reader-master-fixes.js
          node --check public/piper-worker.js

      - name: Build and validate artifact
        run: npm run build
