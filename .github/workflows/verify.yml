name: Verify Mafateeh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare shell scripts
        run: chmod +x scripts/*.sh

      - name: Validate audio mixer syntax
        run: node --check public/reader-mixer.js

      - name: Build and validate artifact
        run: npm run build
