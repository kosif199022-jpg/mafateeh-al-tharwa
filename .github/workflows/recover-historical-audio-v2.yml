name: Recover Historical Mafateeh Audio v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-historical-audio-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all historical Worker versions and recover chapter audio
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN missing'; exit 2; }
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          mkdir -p public/audio

          sub_json=$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.result.subdomain)' "$sub_json")
          echo "workers.dev subdomain: $subdomain"

          scripts_json=$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          mapfile -t workers < <(node -e 'const x=JSON.parse(process.argv[1]); for(const s of (x.result||[])){const id=s.id||s.name; if(id&&/mafateeh/i.test(id)) console.log(id)}' "$scripts_json")
          echo "Workers: ${workers[*]}"

          probe() {
            local base="$1" h b c n
            h=$(mktemp); b=$(mktemp)
            if curl -fsSL --max-time 20 -D "$h" -o "$b" "$base/audio/chapter-01.mp3"; then
              c=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2; exit}' "$h")
              n=$(wc -c < "$b" | tr -d ' ')
              rm -f "$h" "$b"
              if { [[ "$c" == audio/* ]] || [[ "$c" == application/octet-stream* ]]; } && [ "$n" -gt 20000 ]; then
                echo "FOUND $base chapter01=$n type=$c"
                return 0
              fi
              echo "Not audio at $base type=${c:-unknown} bytes=$n"
              return 1
            fi
            rm -f "$h" "$b"
            return 1
          }

          source=''
          for worker in "${workers[@]}"; do
            versions_json=$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/versions?per_page=100")
            mapfile -t versions < <(node -e '
              const x=JSON.parse(process.argv[1]);
              const items=x.result?.items||[];
              for(const v of items){
                if(v.id) console.log([v.id,v.number??"",v.metadata?.hasPreview===false?"no":"yes",v.metadata?.created_on||""].join("|"));
              }
            ' "$versions_json")
            echo "$worker versions=${#versions[@]}"
            for row in "${versions[@]}"; do
              IFS='|' read -r id number previewable created <<< "$row"
              echo "  version=$number id=$id preview=$previewable created=$created"
              [ "$previewable" = no ] && continue
              base="https://${id:0:8}-${worker}.${subdomain}.workers.dev"
              if probe "$base"; then source="$base"; echo "SOURCE worker=$worker version=$id"; break 2; fi
            done
          done

          [ -n "$source" ] || { echo '::error::No historical version with chapter MP3 found'; exit 3; }

          total=0
          for n in $(seq -w 1 34); do
            out="public/audio/chapter-$n.mp3"
            h=$(mktemp)
            curl -fL --retry 3 --retry-delay 2 --max-time 120 -D "$h" -o "$out.tmp" "$source/audio/chapter-$n.mp3"
            c=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2; exit}' "$h")
            bytes=$(wc -c < "$out.tmp" | tr -d ' ')
            rm -f "$h"
            if ! { [[ "$c" == audio/* ]] || [[ "$c" == application/octet-stream* ]]; } || [ "$bytes" -le 20000 ]; then
              echo "::error::chapter-$n invalid type=${c:-unknown} bytes=$bytes"; exit 4
            fi
            mv "$out.tmp" "$out"
            total=$((total+bytes))
            echo "chapter-$n.mp3 $bytes bytes"
          done
          echo "Recovered total=$total bytes"
          [ "$total" -gt 20000000 ] || { echo '::error::Audio set too small'; exit 5; }
          printf '%s\n' "$source" > public/audio/RECOVERED_FROM.txt

      - name: Commit recovered MP3 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/chapter-*.mp3 public/audio/RECOVERED_FROM.txt
          git commit -m 'Restore original 34-chapter audiobook files'
          git push origin HEAD:main
