name: Deploy Kosif v36.3 Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-kosif-native-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kosif-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - name: Checkout deployment credential repository
        uses: actions/checkout@v4

      - name: Checkout Kosif production main
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/mahmoud1990
          ref: main
          path: kosif

      - name: Validate Kosif v36.3 source
        shell: bash
        working-directory: kosif
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing.'; exit 2; }
          test -f wrangler.toml
          test -f src/worker.js
          test -f public/index.html
          test -f public/v36-continuity.js
          test -f public/v36-engagement.js
          test -f public/v36-voice-guide.js
          test -f public/v36-history-restore.js
          test -f public/v36-reviewer-media.js
          test -f scripts/verify-v36-3-runtime.cjs
          npm run check
          grep -q '"version": "36.3.0"' package.json
          grep -q "version:'v36.3'" src/worker.js
          grep -q '2026.08.17-v36.3-master-requirements' src/worker.js
          grep -q "u.pathname==='/__version'" src/worker.js
          grep -q "u.pathname==='/__asset-index'" src/worker.js
          grep -q 'return nativeShell(req,env)' src/worker.js
          grep -q 'dataset.kosifCompanyState' public/v36-continuity.js
          ! grep -q 'document.documentElement.dataset.kosifActiveCompany' public/v36-continuity.js
          grep -q '90% إلى 200%' public/index.html
          grep -q '/v36-voice-guide.js?v=36.3-history1' public/index.html
          grep -q '/v36-history-restore.js?v=36.3-history1' public/index.html
          grep -q "'/v36-voice-guide.js'" public/sw.js
          grep -q "'/v36-history-restore.js'" public/sw.js
          grep -q 'ابدأ منين' public/v36-voice-guide.js
          grep -q "it:'Italiano'" public/v36-history-restore.js
          grep -q "hi:'हिन्दी'" public/v36-history-restore.js
          grep -q "\['IAS 33','IFRS 8','ISA 701'\]" public/v36-history-restore.js
          grep -q 'kosif-native-v36-3-app' public/sw.js
          grep -q 'kosif-native-v36-3-standards' public/standards/sw.js
          grep -q 'IFRS 20' public/v36-standards-readiness.js
          grep -q "VERIFIED_AS_OF='2026-08-17'" public/v36-standards-readiness.js
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"

      - name: Deploy Kosif v36.3 to live Worker
        shell: bash
        working-directory: kosif
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --name mahmoud-eldesouky 2>&1 | tee /tmp/kosif-deploy.log
          echo '--- deployment identity ---'
          grep -Ei 'Version ID|Current Version ID|Uploaded mahmoud-eldesouky|Deployed mahmoud-eldesouky' /tmp/kosif-deploy.log || true

      - name: Verify live v36.3 root, security and libraries
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            hcode=$(curl -sS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/__health?cb=$cb" -o /tmp/health.json -w '%{http_code}' || true)
            vcode=$(curl -sS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/__version?cb=$cb" -o /tmp/version.json -w '%{http_code}' || true)
            rcode=$(curl -sS -D /tmp/root.headers -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/?cb=$cb" -o /tmp/index.html -w '%{http_code}' || true)
            tr -d '\r' < /tmp/root.headers > /tmp/root.clean || true
            release=$(awk 'BEGIN{IGNORECASE=1} /^x-kosif-release:/{sub(/^x-kosif-release:[[:space:]]*/,"");print;exit}' /tmp/root.clean || true)
            echo "attempt=$attempt health=$hcode version=$vcode root=$rcode release=$release"
            if [ "$hcode" = 200 ] && [ "$vcode" = 200 ] && [ "$rcode" = 200 ] \
              && grep -q '"version":"v36.3"' /tmp/health.json \
              && grep -q '"buildId":"2026.08.17-v36.3-master-requirements"' /tmp/health.json \
              && grep -q '"version":"v36.3"' /tmp/version.json \
              && grep -q '"appCache":"kosif-native-v36-3-app"' /tmp/version.json \
              && grep -q '"standardsCache":"kosif-native-v36-3-standards"' /tmp/version.json \
              && grep -q '"max":200' /tmp/version.json \
              && [ "$release" = 'native-v36-3-master-requirements' ] \
              && grep -q 'id="kosif-boot"' /tmp/index.html \
              && grep -q '/v36-continuity.js?v=36.3' /tmp/index.html \
              && grep -q '/v36-voice-guide.js?v=36.3-history1' /tmp/index.html \
              && grep -q '/v36-history-restore.js?v=36.3-history1' /tmp/index.html \
              && grep -q '90% إلى 200%' /tmp/index.html \
              && ! grep -q 'https://kosif-standards-library.kosif199022.workers.dev/' /tmp/index.html \
              && ! grep -q 'AI Active ·' /tmp/index.html; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Live v36.3 root did not fully propagate.'; cat /tmp/health.json /tmp/version.json; exit 1; }

          cb="${GITHUB_RUN_ID}-asset-$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/__asset-index?cb=$cb" -o /tmp/asset.json
          grep -q '"hasKosifBoot":true' /tmp/asset.json
          grep -q '"hasV36Continuity":true' /tmp/asset.json

          locked=$(curl -sS -o /tmp/locked.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"provider":"gemini","model":"gemini-3.6-flash","key":"dummy","prompt":"x"}' "$LIVE_URL/api/kosif/ai")
          [ "$locked" = 401 ]
          grep -q 'AI_LOCKED' /tmp/locked.json

          cb="${GITHUB_RUN_ID}-std-$(date +%s%N)"
          stdcode=$(curl -sS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/standards/?cb=$cb" -o /tmp/standards.html -w '%{http_code}')
          [ "$stdcode" = 200 ]
          grep -q 'reader-pro-v36.js' /tmp/standards.html
          for path in b1/1 b3/34 b2/139 b4/46; do
            code=$(curl -sS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/standards/data/$path.json?cb=$cb" -o /tmp/chapter.json -w '%{http_code}')
            [ "$code" = 200 ] || { echo "chapter failed: $path -> $code"; exit 1; }
          done
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/standards/data/library.json?cb=$cb" -o /tmp/library.json
          node - <<'NODE'
          const x=require('/tmp/library.json');
          const want={b1:66,b3:34,b2:139,b4:46};
          for(const [id,n] of Object.entries(want)){const b=x.find(v=>v.id===id);if(!b||b.chapters!==n)throw new Error(id+' chapter mismatch')}
          console.log('live standards inventory',want)
          NODE

          smartok=0
          for attempt in $(seq 1 20); do
            cb="${GITHUB_RUN_ID}-smart-${attempt}-$(date +%s%N)"
            scode=$(curl -sS -D /tmp/smart.headers -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/library/smart?cb=$cb" -o /tmp/smart.html -w '%{http_code}' || true)
            tr -d '\r' < /tmp/smart.headers > /tmp/smart.clean || true
            marker=$(awk 'BEGIN{IGNORECASE=1} /^x-kosif-library:/{sub(/^x-kosif-library:[[:space:]]*/,"");print;exit}' /tmp/smart.clean || true)
            echo "smart-attempt=$attempt http=$scode marker=$marker bytes=$(wc -c </tmp/smart.html 2>/dev/null || echo 0)"
            if [ "$scode" = 200 ] && [ "$marker" = 'smart-books' ] && grep -Eqi 'مكتبة|كتاب|library' /tmp/smart.html; then smartok=1; break; fi
            sleep 4
          done
          [ "$smartok" -eq 1 ] || { echo '::error::Smart Library is unavailable live.'; exit 1; }

          apicode=$(curl -sS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/api/library?cb=$cb" -o /tmp/library-api.json -w '%{http_code}' || true)
          [ "$apicode" = 200 ]
          node -e "const x=require('/tmp/library-api.json');if(!Array.isArray(x.books))process.exit(1);console.log('live smart books',x.books.length,x.books.map(b=>b.name))"

          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/v36-ai-gate.js?cb=$cb" -o /tmp/gate.js
          grep -q "version:'36.3.0'" /tmp/gate.js
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/v36-continuity.js?cb=$cb" -o /tmp/continuity.js
          grep -q 'dataset.kosifCompanyState' /tmp/continuity.js
          ! grep -q 'document.documentElement.dataset.kosifActiveCompany' /tmp/continuity.js
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/v36-standards-readiness.js?cb=$cb" -o /tmp/readiness.js
          grep -q 'IFRS 20' /tmp/readiness.js
          grep -q "VERIFIED_AS_OF='2026-08-17'" /tmp/readiness.js
          grep -q 'socpaUpdate2026' /tmp/readiness.js
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/v36-voice-guide.js?cb=$cb" -o /tmp/voice.js
          grep -q 'ابدأ منين' /tmp/voice.js
          grep -q 'SpeechSynthesisUtterance' /tmp/voice.js
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/v36-history-restore.js?cb=$cb" -o /tmp/history.js
          grep -q "it:'Italiano'" /tmp/history.js
          grep -q "hi:'हिन्दी'" /tmp/history.js
          grep -q 'SME plus listed\|smeConflict' /tmp/history.js

          echo "LIVE_KOSIF_V36_3_HISTORY_RESTORATION_OK $LIVE_URL"
