name: Deploy Kosif v36.1 Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-kosif-native-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kosif-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - name: Checkout deployment credential repository
        uses: actions/checkout@v4

      - name: Checkout Kosif production main
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/mahmoud1990
          ref: main
          path: kosif

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing in this repository.'; exit 2; }

      - name: Validate Kosif v36.1 release source
        shell: bash
        working-directory: kosif
        run: |
          set -euo pipefail
          test -f RELEASE_MANIFEST_V36_1.json
          test -f wrangler.toml
          test -f src/worker.js
          test -f public/index.html
          test -f public/v36-ai-gate.js
          test -f public/v36-standards-readiness.js
          test -f public/standards/index.html
          test -f public/standards/reader-pro-v36.js
          node --check src/worker.js
          node --check public/v36-ai-gate.js
          node --check public/v36-governance.js
          node --check public/v36-standards-readiness.js
          node --check public/standards/reader-pro-v36.js
          node --check public/sw.js
          node --check public/standards/sw.js
          grep -q 'IFRS 20' public/v36-standards-readiness.js
          grep -q "VERIFIED_AS_OF='2026-08-17'" public/v36-standards-readiness.js
          grep -q 'socpaUpdate2026' public/v36-standards-readiness.js
          node scripts/deep-audit-v36.mjs
          node - <<'NODE'
          const m=require('./RELEASE_MANIFEST_V36_1.json');
          if(!String(m.release).includes('v36.1')) throw new Error('Not a v36.1 release');
          if(m.aiGate?.mode!=='owner-password + per-provider tested-key verification') throw new Error('AI gate manifest mismatch');
          console.log(m.release, m.aiGate.mode);
          NODE

      - name: Deploy Kosif v36.1 to live Worker
        working-directory: kosif
        run: npx --yes wrangler@4 deploy --name mahmoud-eldesouky

      - name: Verify live deployment after propagation
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            hcode=$(curl -sS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/__health?cb=$cb" -o /tmp/health.json -w '%{http_code}' || true)
            rcode=$(curl -sS -D /tmp/headers.txt -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/?cb=$cb" -o /tmp/index.html -w '%{http_code}' || true)
            tr -d '\r' < /tmp/headers.txt > /tmp/headers.clean || true
            release=$(awk 'BEGIN{IGNORECASE=1} /^x-kosif-release:/{sub(/^x-kosif-release:[[:space:]]*/,"");print;exit}' /tmp/headers.clean || true)
            echo "attempt=$attempt health=$hcode root=$rcode release=$release healthBody=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$hcode" = 200 ] && [ "$rcode" = 200 ] \
              && grep -q '"version":"v36.1"' /tmp/health.json \
              && grep -q '"aiGate":"owner-password+verified-key"' /tmp/health.json \
              && [ "$release" = 'native-v36-1-deep-audit' ] \
              && grep -q 'KOSIF_CLIENT_V36_1_2026_08_17' /tmp/index.html \
              && ! grep -q 'AI Active ·' /tmp/index.html; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo '::error::Live v36.1 did not fully propagate within verification window.'; exit 1; }

          locked=$(curl -sS -o /tmp/locked.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"provider":"gemini","model":"gemini-3.6-flash","key":"dummy","prompt":"x"}' "$LIVE_URL/api/kosif/ai")
          echo "locked_ai_http=$locked body=$(cat /tmp/locked.json)"
          [ "$locked" = 401 ]
          grep -q 'AI_LOCKED' /tmp/locked.json

          testlocked=$(curl -sS -o /tmp/testlocked.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"provider":"gemini","model":"gemini-3.6-flash","key":"dummy"}' "$LIVE_URL/api/kosif/ai/test")
          echo "locked_ai_test_http=$testlocked body=$(cat /tmp/testlocked.json)"
          [ "$testlocked" = 401 ]
          grep -q 'AI_LOCKED' /tmp/testlocked.json

          cb="${GITHUB_RUN_ID}-std-$(date +%s%N)"
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/standards/?cb=$cb" -o /tmp/standards.html
          grep -q 'reader-pro-v36.js?v=36.1' /tmp/standards.html
          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/standards/data/library.json?cb=$cb" -o /tmp/library.json
          node - <<'NODE'
          const x=require('/tmp/library.json');
          const b1=x.find(v=>v.id==='b1'),b3=x.find(v=>v.id==='b3'),b2=x.find(v=>v.id==='b2');
          if(!b1||b1.chapters!==66||!b3||b3.chapters!==34||!b2||b2.chapters!==139) process.exit(1);
          console.log('live chapters',b1.chapters,b3.chapters,b2.chapters);
          NODE

          curl -fsS -H 'Cache-Control: no-cache, no-store, max-age=0' "$LIVE_URL/v36-standards-readiness.js?cb=$cb" -o /tmp/readiness.js
          grep -q 'IFRS 20' /tmp/readiness.js
          grep -q "VERIFIED_AS_OF='2026-08-17'" /tmp/readiness.js
          grep -q 'socpaUpdate2026' /tmp/readiness.js
          echo "LIVE_KOSIF_V36_1_OK $LIVE_URL"
