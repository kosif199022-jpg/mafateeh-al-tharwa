name: Deploy Kosif Native v35 Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-kosif-native-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kosif-native-v35-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
    steps:
      - name: Checkout deployment credential repository
        uses: actions/checkout@v4

      - name: Checkout Kosif Native v35
        uses: actions/checkout@v4
        with:
          repository: kosif199022-jpg/mahmoud1990
          ref: main
          path: kosif

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing in this repository.'; exit 2; }

      - name: Validate Kosif v35 source
        shell: bash
        working-directory: kosif
        run: |
          set -euo pipefail
          test -f RELEASE_MANIFEST_V35.json
          test -f wrangler.toml
          test -f src/worker.js
          test -f public/index.html
          test -f public/standards/index.html
          node --check src/worker.js
          node --check public/standards/bridge.js
          node --check public/sw.js
          node - <<'NODE'
          const m=require('./RELEASE_MANIFEST_V35.json');
          if(!String(m.release).includes('Kosif Native v35')) throw new Error('Not a v35 release');
          if(m.standards?.refMap!==66) throw new Error('ref-map mismatch');
          console.log(m.release, 'refs=', m.standards.refMap, 'index=', m.standards.packagedIndexRows);
          NODE

      - name: Deploy Kosif Native v35 to live Worker
        working-directory: kosif
        run: npx --yes wrangler@4 deploy --name mahmoud-eldesouky

      - name: Verify live deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            code=$(curl -LfsS --max-redirs 5 -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/__health?cb=$cb" -o /tmp/health.json -w '%{http_code}' || true)
            echo "attempt=$attempt http=$code body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = 200 ] && grep -q '"version":"v35"' /tmp/health.json && grep -q '"release":"A1990"' /tmp/health.json; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" -eq 1 ] || { echo '::error::Live Worker did not report Kosif Native v35.'; exit 1; }

          cb="${GITHUB_RUN_ID}-final-$(date +%s)"
          curl -LfsS -D /tmp/headers.txt -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/?cb=$cb" -o /tmp/index.html
          tr -d '\r' < /tmp/headers.txt | tee /tmp/headers.clean
          grep -qi '^x-kosif-release: native-v35-a1990$' /tmp/headers.clean
          grep -q 'kosif-bottom-nav' /tmp/index.html
          grep -q 'المطالبات' /tmp/index.html

          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/standards/?cb=$cb" -o /tmp/standards.html
          curl -LfsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/standards/data/ref-map.json?cb=$cb" -o /tmp/ref-map.json
          node -e "const x=require('/tmp/ref-map.json'); if(x.refs.length!==66) process.exit(1); console.log('live refs',x.refs.length)"
          echo "LIVE_KOSIF_NATIVE_V35_OK $LIVE_URL"
